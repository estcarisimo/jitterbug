name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Minimal `jitterbug` command or Python snippet. Attach or link a small RTT file if possible (the bundled `examples/network_analysis/data/raw.csv` is ideal).
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Jitterbug version
      description: Output of `jitterbug version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Python 3.12, macOS 14, installed with uv, algorithm=ruptures"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      render: shell
