name: CI

on:
  push:
    branches: [main]
  pull_request:  # every PR, including stacked ones whose base is another branch

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --extra visualization --extra clustering --extra zstd

      - name: Ruff lint
        run: uv run ruff check src/ tests/ examples/ tools/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ examples/ tools/

      - name: mypy
        run: uv run mypy src/jitterbug

      - name: bandit (static security scan of the package)
        run: uvx bandit -r src/jitterbug -q

      - name: pip-audit (audits the locked dependency set)
        run: |
          uv export --no-emit-project --no-hashes --extra visualization --extra clustering --extra zstd \
            --format requirements.txt -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build the documentation site (warnings are errors)
        run: uv run --locked --group docs mkdocs build --strict

      - name: Validate CITATION.cff
        run: uvx cffconvert --validate

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --extra visualization --extra clustering --extra zstd

      - name: Run tests
        run: uv run pytest tests/ -m "not slow" --cov=jitterbug --cov-report=term-missing --cov-report=xml --cov-fail-under=75

      - name: CLI smoke test
        run: uv run jitterbug analyze examples/network_analysis/data/raw.csv --output results.json

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  test-bcp:
    name: test (bcp extra, ubuntu-latest, 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies (CPU torch via the pytorch-cpu index)
        run: uv sync --locked --extra bcp --extra visualization --extra clustering --extra zstd

      - name: Run the full suite, including the Bayesian regression tests
        run: uv run pytest tests/ -m "slow or not slow"

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint, test, test-bcp]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Build package
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Install the wheel in a clean environment and smoke test
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/jitterbug version
          /tmp/smoke/bin/jitterbug analyze examples/network_analysis/data/raw.csv --output /tmp/smoke/results.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
