name: CI

on:
  push:
    branches: [main]
  pull_request:  # every PR, including stacked ones whose base is another branch

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra visualization

      - name: Ruff lint
        run: uv run ruff check src/ tests/ examples/ tools/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/ examples/ tools/

      - name: mypy (advisory until the known errors are fixed)
        run: uv run mypy src/jitterbug
        continue-on-error: true

      - name: pip-audit (audits the locked dependency set)
        run: |
          uv export --no-emit-project --no-hashes --extra dev --extra visualization \
            --format requirements.txt -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip

  test:
    name: test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra visualization

      - name: Run tests
        run: uv run pytest tests/ --cov=jitterbug --cov-report=term-missing --cov-report=xml

      - name: CLI smoke test
        run: uv run jitterbug analyze examples/network_analysis/data/raw.csv --output results.json

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Build package
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Install the wheel in a clean environment and smoke test
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/jitterbug version
          /tmp/smoke/bin/jitterbug analyze examples/network_analysis/data/raw.csv --output /tmp/smoke/results.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
