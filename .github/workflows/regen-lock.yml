# Temporary: regenerates uv.lock for PR #78 (the authoring session cannot reach the
# pytorch-cpu index). Removed again before the PR is ready.
name: regenerate uv.lock (temporary)

on:
  push:
    branches: [claude/drop-python-3.10]
    paths: [.github/workflows/regen-lock.yml]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: claude/drop-python-3.10

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Regenerate the lockfile
        run: uv lock --upgrade-package soupsieve

      - name: Commit uv.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: regenerate uv.lock without the soupsieve 2.x fork"
          git push origin HEAD:claude/drop-python-3.10
