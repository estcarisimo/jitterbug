# Publishes jitterbug-inference to PyPI when a GitHub release is published, and to
# PyPI or TestPyPI on demand (Actions → Publish → Run workflow, with the tag to build).
#
# Uploads use PyPI Trusted Publishing (OpenID Connect): the job proves it is this
# workflow in this repository and receives a short-lived upload token, so no API token
# is stored anywhere. Each index needs a publisher for owner `estcarisimo`, repository
# `jitterbug`, workflow `publish.yml`, and the environment of the job that uploads to it
# (`pypi` or `testpypi`). Protection rules on the `pypi` environment (required reviewer)
# gate every real upload.
#
# The build always checks out a tag and refuses to continue unless the version in
# pyproject.toml equals the tag without its leading `v`. PyPI uploads cannot be undone
# or replaced; a mistake means a new version number.
#
# https://docs.pypi.org/trusted-publishers/

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and upload (e.g. v2.1.0)"
        required: true
        type: string
      target:
        description: "Where to upload"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Build package
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Check the version against the tag
        run: |
          # dist/jitterbug_inference-<version>-py3-none-any.whl
          wheel_version="$(ls dist/*.whl | sed -E 's/.*-([0-9][^-]*)-py3-.*/\1/')"
          tag_version="${TAG#v}"
          echo "wheel: $wheel_version, tag: $tag_version"
          if [ "$wheel_version" != "$tag_version" ]; then
            echo "::error::version in pyproject.toml ($wheel_version) does not match the tag ($tag_version)"
            exit 1
          fi

      - name: Install the wheel in a clean environment and smoke test
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/jitterbug version
          /tmp/smoke/bin/jitterbug analyze examples/network_analysis/data/raw.csv --output /tmp/smoke/results.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: distributions
          path: dist/

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/p/jitterbug-inference
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'release' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/jitterbug-inference
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  attach:
    # Runs after the upload, so a failure here means the version IS on PyPI and only
    # the release assets are missing; re-running this job alone is safe.
    name: Attach the distributions to the GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # upload release assets
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Upload the sdist and wheel as release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
