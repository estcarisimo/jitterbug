[build-system]
requires = ["uv_build>=0.12.14,<0.13"]
build-backend = "uv_build"

[project]
name = "jitterbug-inference"
version = "2.1.0"
description = "Framework for jitter-based network congestion inference"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Esteban Carisimo", email = "esteban.carisimo@northwestern.edu"}
]
maintainers = [
    {name = "Esteban Carisimo", email = "esteban.carisimo@northwestern.edu"}
]
keywords = ["network", "congestion", "rtt", "jitter", "analysis", "changepoint", "detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Internet :: Log Analysis",
    "Typing :: Typed",
]
requires-python = ">=3.10"
# Floors are the oldest releases with Python 3.10 wheels that the code base is known to
# work with; the lockfile pins what CI actually runs.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "ruptures>=1.1.9",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Change point detection back ends. `ruptures` is a core dependency; `bcp` is opt-in.
# `bcp` is the PyPI distribution `bayesian-changepoint` (import name
# `bayesian_changepoint_detection`); 1.2 is the first release from the maintained fork.
bcp = [
    "bayesian-changepoint>=1.2",
    "torch>=2.0",  # listed explicitly so the [tool.uv.sources] CPU-index rule applies to it
]
bayesian = ["jitterbug-inference[bcp]"]  # deprecated alias for the old extra name; remove in 3.0
# Data sources and outputs
influx = ["influxdb-client>=1.30.0"]
visualization = ["matplotlib>=3.5.0"]
jupyter = ["ipykernel>=6.0.0", "jupyter>=1.0.0"]
# Every optional back end and front end.
all = [
    "bayesian-changepoint>=1.2",
    "torch>=2.0",
    "influxdb-client>=1.30.0",
    "matplotlib>=3.5.0",
    "ipykernel>=6.0.0",
    "jupyter>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs",
    "types-PyYAML",
    "types-requests",
    "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/estcarisimo/jitterbug"
Repository = "https://github.com/estcarisimo/jitterbug"
"Bug Reports" = "https://github.com/estcarisimo/jitterbug/issues"
Documentation = "https://github.com/estcarisimo/jitterbug/blob/main/README.md"

[project.scripts]
jitterbug = "jitterbug.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["examples/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
ignore = [
    "B008",  # typer.Option(...) defaults are the documented Typer pattern
]

[tool.ruff.lint.isort]
known-first-party = ["jitterbug"]

[tool.mypy]
# 3.12 so mypy can parse numpy 2.5's stubs (they use the `type` statement); the 3.10
# language floor is enforced by ruff (target-version = "py310").
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "ruptures.*",
    "scipy.*",
    "bayesian_changepoint_detection.*",
    "influxdb_client.*",
    "matplotlib.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src/jitterbug"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[[tool.uv.index]]
# torch is only pulled in by the `bcp` extra. On Linux the default index resolves to the
# CUDA build (about 2 GB); the CPU wheels are a tenth of that and all the detector needs.
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.build-backend]
module-name = "jitterbug"  # the distribution is jitterbug-inference, the import package is jitterbug

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
