[build-system]
requires = ["uv_build>=0.8,<0.10"]
build-backend = "uv_build"

[project]
name = "jitterbug"
version = "2.0.0"
description = "Framework for jitter-based network congestion inference"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Esteban Carisimo", email = "esteban.carisimo@northwestern.edu"}
]
maintainers = [
    {name = "Esteban Carisimo", email = "esteban.carisimo@northwestern.edu"}
]
keywords = ["network", "congestion", "rtt", "jitter", "analysis", "changepoint", "detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Internet :: Log Analysis",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "ruptures>=1.1.0",
    "typer>=0.9.0",
    "rich>=12.0.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
# Change point detection back ends. `ruptures` is a core dependency; the rest are opt-in.
# `bcp` is a git dependency until bayesian_changepoint_detection is published on PyPI,
# which also means a wheel with this extra cannot be uploaded to PyPI yet.
bcp = ["bayesian_changepoint_detection @ git+https://github.com/estcarisimo/bayesian_changepoint_detection.git"]
bayesian = ["jitterbug[bcp]"]  # deprecated alias for the old extra name; remove in 3.0
torch = ["torch>=2.0"]
rbeast = ["Rbeast>=0.1.20"]
adtk = ["adtk>=0.6"]
# Data sources and outputs
influx = ["influxdb-client>=1.30.0"]
visualization = ["matplotlib>=3.5.0", "plotly>=5.0.0"]
api = ["fastapi>=0.104.0", "uvicorn>=0.24.0"]
jupyter = ["ipykernel>=6.0.0", "jupyter>=1.0.0"]
# Everything installable from PyPI (excludes `bcp`, see above)
all = [
    "torch>=2.0",
    "Rbeast>=0.1.20",
    "adtk>=0.6",
    "influxdb-client>=1.30.0",
    "matplotlib>=3.5.0",
    "plotly>=5.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "ipykernel>=6.0.0",
    "jupyter>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs",
    "types-PyYAML",
    "types-requests",
    "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/estcarisimo/jitterbug"
Repository = "https://github.com/estcarisimo/jitterbug"
"Bug Reports" = "https://github.com/estcarisimo/jitterbug/issues"
Documentation = "https://github.com/estcarisimo/jitterbug/blob/main/README.md"

[project.scripts]
jitterbug = "jitterbug.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["examples/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
# Temporary ignores, each tracked as a follow-up PR in the roadmap (Fase 1/4).
# Remove an entry when its findings are fixed; do not add new ones.
ignore = [
    "B008",    # typer.Option(...) defaults are the documented Typer pattern
    "B904",    # raise ... from err inside except: 15 sites, module by module
    "E501",    # long lines: 69 sites, mostly docstrings and log strings
    "PTH",     # pathlib migration: 31 sites (open(), os.path.join, ...)
    "SIM102",  # collapsible if: 5 sites
    "SIM108",  # if/else -> ternary: 3 sites
]

[tool.ruff.lint.isort]
known-first-party = ["jitterbug"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "ruptures.*",
    "bayesian_changepoint_detection.*",
    "influxdb_client.*",
    "matplotlib.*",
    "plotly.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src/jitterbug"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
