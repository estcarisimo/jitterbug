# Documentation site, published to GitHub Pages by .github/workflows/pages.yml.
# Build it with `uv run --group docs mkdocs build --strict` (CI does on every PR).
# The home, changelog, contributing and citing pages include the files at the
# repository root, so the site and the README cannot drift apart; the API pages are
# generated from the docstrings.
site_name: Jitterbug
site_description: Jitter-based congestion inference from RTT time series (PAM 2022)
site_url: https://estcarisimo.github.io/jitterbug/
repo_url: https://github.com/estcarisimo/jitterbug
repo_name: estcarisimo/jitterbug
edit_uri: edit/main/docs/
copyright: MIT License. Esteban Carisimo and contributors.

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Installation: INSTALLATION.md
  - Input formats: INPUT_FORMATS.md
  - Choosing a detector: ALGORITHM_SELECTION_GUIDE.md
  - Detectors and methods: ALGORITHM_USAGE.md
  - Visualization: VISUALIZATION_USAGE.md
  - Clustering mode: CLUSTERING_MODE.md
  - API reference:
      - Analyzer: api/analyzer.md
      - Configuration: api/config.md
      - Data models: api/models.md
      - Change point detection: api/detection.md
      - Latency and jitter analysis: api/analysis.md
      - Input and output: api/io.md
      - Plotting: api/visualization.md
  - Changelog: changelog.md
  - Contributing: contributing.md
  - Citing: citing.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      # Paths are relative to the repository root; a missing file fails the build
      # instead of rendering an empty page.
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            members_order: source
            heading_level: 2
            filters: ["!^_"]
